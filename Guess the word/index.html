    <title>Guess the word</title>
</head>
<body>
  <h1>Guess the player</h1>
  <div class="the-game">

    <div class="game">
      <div class="inputs"></div>
      <div class="bts">
<button class="check">Check Word</button>
</div>
<div class="msg"></div>
    </div>
    <div class="keys" >
      <h3>key Colors</h3>
      <div>
        <div class="org" style="background-color: green; margin: 0 5px; " ></div>
        <p>Letter is Right And In Place</p>
      </div>
      <div>
        <div class="green" style="background-color: blue; margin: 0 5px;"></div>

      <div>

      </div>
    </div>
  </div>
  </div>
